# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
language: 'en-US'
reviews:
  profile: 'chill'
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - 'chore: release main'
  path_filters:
    - '!pnpm-lock.yaml'
    - '!**/RELEASE-NOTES.md'
    - '!.release-please-manifest.json'
