# Inline copy of the `scan` job in eldra-is/.github secret-scan.yml (see CLAUDE.md); keep the steps identical.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  BETTERLEAKS_VERSION: 1.9.0
  BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7
  MODE: ${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'push' && 'push' || 'full' }}

jobs:
  scan:
    name: Secret scan / betterleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Betterleaks
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}"
          tarball="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "$base/$tarball"
          curl -fsSL -o checksums.txt "$base/checksums.txt"
          echo "verify against the release's checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          echo "verify against the checksum pinned in this workflow"
          echo "${BETTERLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p betterleaks
          tar -xzf "$tarball" -C betterleaks betterleaks
          ./betterleaks/betterleaks version

      - name: Refuse a mode the event does not allow
        env:
          MODE: ${{ env.MODE }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A caller workflow lives in the scanned repository, so a pull request could
          # rewrite it to ask for mode full (which never fails). Only the self-test in
          # eldra-is/.github may run other modes on a pull request.
          case "$EVENT" in
            pull_request|pull_request_target)
              if [ "$MODE" != pr ] && [ "$REPO" != eldra-is/.github ]; then
                echo "::error::mode '$MODE' is not allowed on a $EVENT event (only pr)"; exit 1
              fi ;;
            push)
              if [ "$MODE" != push ]; then
                echo "::error::mode '$MODE' is not allowed on a push event (only push)"; exit 1
              fi ;;
          esac
          echo "event $EVENT, mode $MODE: allowed"

      - name: Take the allowlists from the base branch in mode pr
        if: env.MODE == 'pr'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          [ -n "$BASE_REF" ] || { echo "::error::base_ref is required for mode pr"; exit 1; }
          for f in .betterleaks.toml .betterleaksignore; do
            if git cat-file -e "origin/${BASE_REF}:${f}" 2>/dev/null; then
              git show "origin/${BASE_REF}:${f}" > "$f"
              echo "$f: taken from origin/${BASE_REF}"
            elif [ -e "$f" ]; then
              rm -f "$f"
              echo "$f: not on origin/${BASE_REF}, the PR's copy is ignored"
            fi
          done

      - name: Write organisation rules
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/betterleaks-org.toml"
          {
            if [ -f "$GITHUB_WORKSPACE/.betterleaks.toml" ]; then
              grep -Eq '^[[:space:]]*useDefault[[:space:]]*=[[:space:]]*true' "$GITHUB_WORKSPACE/.betterleaks.toml" \
                || { echo "::error::.betterleaks.toml must keep '[extend] useDefault = true', or the default rules are lost"; exit 1; }
              cat "$GITHUB_WORKSPACE/.betterleaks.toml"
              echo
              echo "# --- eldra-is organisation rules, appended by the Secret scan workflow ---"
            else
              echo 'title = "eldra-is organisation rules"'
              echo '[extend]'
              echo 'useDefault = true'
            fi
            sed 's/^  //' <<'TOML'

            # Eldra platform tokens: eldra_<kind>_<random>_<checksum>. The lengths are
            # loose until the format is final; tighten them here when it is.
            [[rules]]
            id = "eldra-token"
            description = "Eldra platform token (eldra_<kind>_<random>_<checksum>)"
            regex = '''\beldra_[a-z][a-z0-9]{1,31}_[A-Za-z0-9]{16,64}_[A-Za-z0-9]{4,16}\b'''
            keywords = ["eldra_"]

            [[allowlists]]
            description = "The repository's Betterleaks allowlist is regex text about secrets; only the generic rules trip on it"
            targetRules = ["generic-api-key", "generic-credential-uri", "generic-password"]
            paths = ['''^\.betterleaks\.toml$''']
          TOML
          } > "$cfg"
          if [ -f "$GITHUB_WORKSPACE/.betterleaks.toml" ]; then
            echo "organisation rules written to $cfg on top of the repository's .betterleaks.toml"
          else
            echo "organisation rules written to $cfg on top of the default rule set"
          fi

      - name: Scan
        env:
          MODE: ${{ env.MODE }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          CANARY: false
        run: |
          set -euo pipefail
          bl="$RUNNER_TEMP/betterleaks/betterleaks"
          exit_code=1
          case "$MODE" in
            pr)
              [ -n "$BASE_REF" ] || { echo "::error::base_ref is required for mode pr"; exit 1; }
              range="origin/${BASE_REF}..HEAD"
              ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                echo "first push: scanning everything reachable from HEAD"
                range="HEAD"
              else
                git rev-parse --verify --quiet "${BEFORE}^{commit}" >/dev/null \
                  || { echo "::error::before commit $BEFORE is not in the clone (force push?); refusing to scan a guessed range"; exit 1; }
                range="${BEFORE}..HEAD"
              fi
              ;;
            full)
              range=""
              exit_code=0
              if [ -f .betterleaksignore ]; then
                mv .betterleaksignore "$RUNNER_TEMP/betterleaksignore.aside"
                echo "mode full: .betterleaksignore set aside so accepted historical findings are reported"
              fi
              ;;
            *)
              echo "::error::unknown mode '$MODE' (expected pr, push or full)"
              exit 1
              ;;
          esac
          args=(git . --no-banner --redact=100 --exit-code "$exit_code" -c "$RUNNER_TEMP/betterleaks-org.toml"
                --report-format json --report-path "$RUNNER_TEMP/report.json")
          if [ -n "$range" ]; then
            args+=(--log-opts "$range")
          fi
          echo "betterleaks ${args[*]}"
          status=0
          "$bl" "${args[@]}" || status=$?
          # A scan that produced no report scanned nothing; never let that pass as green.
          jq -e 'type == "array"' "$RUNNER_TEMP/report.json" >/dev/null \
            || { echo "::error::no report was written; the scan did not run"; exit 1; }
          if [ "$CANARY" = "true" ]; then
            canary="$RUNNER_TEMP/canary.txt"
            {
              echo "AWS_ACCESS_KEY_ID=AKIA$(LC_ALL=C tr -dc 'A-Z2-7' </dev/urandom | head -c 16)"
              echo "AWS_SECRET_ACCESS_KEY=$(LC_ALL=C tr -dc 'A-Za-z0-9/+' </dev/urandom | head -c 40)"
              echo "ELDRA_TOKEN=eldra_canary_$(LC_ALL=C tr -dc 'a-z0-9' </dev/urandom | head -c 32)_$(LC_ALL=C tr -dc 'a-z0-9' </dev/urandom | head -c 6)"
            } > "$canary"
            echo "canary: random AWS-shaped pair and Eldra-shaped token written to $canary; both must be detected"
            echo "betterleaks dir $canary"
            "$bl" dir "$canary" --no-banner --redact=100 --exit-code 0 -c "$RUNNER_TEMP/betterleaks-org.toml" \
              --report-format json --report-path "$RUNNER_TEMP/report-canary.json"
            rules=$(jq -r '[.[].RuleID] | unique | join(" ")' "$RUNNER_TEMP/report-canary.json")
            echo "canary rules that fired: $rules"
            case " $rules " in *" aws-access-token "*) ;; *) echo "::error::canary: aws-access-token did not fire"; status=1 ;; esac
            case " $rules " in *" eldra-token "*) ;; *) echo "::error::canary: eldra-token (organisation rule) did not fire"; status=1 ;; esac
          fi
          exit "$status"

      - name: Upload redacted report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secret-scan-report-${{ env.MODE }}
          path: ${{ runner.temp }}/report*.json
          retention-days: 30
          if-no-files-found: ignore
