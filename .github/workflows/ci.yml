name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build, package checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:check

      - name: Format
        run: pnpm format:check

      - name: Build, so the workspace packages' types exist for the steps below
        run: pnpm build

      - name: Types, including the specs
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: publint
        run: pnpm publint

      - name: Are the types wrong
        run: pnpm attw

      - name: Size budgets
        run: pnpm size

      - name: Tarball smoke test
        run: pnpm pack-smoke
