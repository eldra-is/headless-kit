name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build, package checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm test` runs theme-nuxt's two browser specs, which need a real
      # browser; the screenshot harness (`pnpm --filter @eldrajs/ui
      # screenshots`) is deliberately *not* part of `check` and does not run
      # here — its baselines are macOS renderings, see packages/ui/README.md.
      - name: Chromium, for the theme-nuxt browser tests
        run: pnpm exec playwright install --with-deps chromium

      # One step, on purpose: `check` is the same command a contributor runs
      # locally, so CI and it cannot drift. Enumerating its steps here is how
      # the @eldrajs/ui Storybook build went unbuilt in CI while `check` built
      # it. Add new gates to the root `check` script, not to this file.
      - name: Lint, format, build, types, tests, package checks, Storybook builds
        run: pnpm check
