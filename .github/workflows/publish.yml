name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    # Trusted publishing: npm exchanges this job's OIDC token for publish rights, so no NPM_TOKEN
    # exists anywhere. Provenance requires a GitHub-hosted runner and a public repository.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Package directory from the release tag
        id: target
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          component="${TAG%-v*}"
          dir="packages/${component}"
          test -f "${dir}/package.json" || { echo "no package for tag ${TAG}"; exit 1; }
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Pack
        run: pnpm --filter "./${{ steps.target.outputs.dir }}" pack --pack-destination "${{ runner.temp }}/out"

      - name: Publish with provenance
        run: |
          npm install -g npm@^11.5
          npm publish "${{ runner.temp }}"/out/*.tgz --provenance --access public
