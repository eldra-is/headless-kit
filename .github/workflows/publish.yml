name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)publish, for example sdk-v0.1.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      dir: ${{ steps.target.outputs.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Package directory from the release tag
        id: target
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          component="${TAG%-v*}"
          dir="packages/${component}"
          test -f "${dir}/package.json" || { echo "no package for tag ${TAG}"; exit 1; }
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Pack
        run: pnpm --filter "./${{ steps.target.outputs.dir }}" pack --pack-destination "${{ runner.temp }}/out"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tarball
          path: ${{ runner.temp }}/out/*.tgz
          if-no-files-found: error
          retention-days: 1

  # The draft preview parity gate (WS-1358): a session renders exactly what Publish puts live, DOM
  # and pixels, through two real generates of the starter. Already part of `pnpm check` on every
  # pull request, the release pull request included; run again here, on the tag being published,
  # so no package is published from a commit it did not pass on. Releasing the theme packages
  # without it would let Studio offer Preview on a kit whose preview is not the live page.
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      # A tag cut before the gate existed (a re-publish through workflow_dispatch) has no
      # `test:parity` script: nothing to run, and it says so.
      - name: Whether this ref has the parity gate
        id: gate
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:parity'] ? 0 : 1)"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no test:parity script at this ref; the draft preview parity gate is skipped"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.gate.outputs.present == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - if: steps.gate.outputs.present == 'true'
        run: pnpm build

      - name: Draft preview parity
        if: steps.gate.outputs.present == 'true'
        run: pnpm test:parity

      # Both screenshots and their difference, from a pixel test that failed (WS-1277).
      - name: Preview parity screenshots
        if: failure() && steps.gate.outputs.present == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: preview-parity-screenshots
          path: examples/starter-nuxt/test-results/preview-parity/
          if-no-files-found: ignore
          retention-days: 14

  npm:
    # Trusted publishing: npm exchanges this job's OIDC token for publish rights, so no NPM_TOKEN
    # exists anywhere. Provenance requires a GitHub-hosted runner and a public repository.
    needs: [pack, parity]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: tarball
          path: out

      - name: Skip when this version is already on the registry
        id: existing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          name=$(tar -xzOf ./out/*.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).name")
          version=$(tar -xzOf ./out/*.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          if npm view "${name}@${version}" version  >/dev/null 2>&1; then
            echo "${name}@${version} is already published here; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with provenance
        if: steps.existing.outputs.skip != 'true'
        run: |
          npm install -g npm@^11.5
          npm publish ./out/*.tgz --provenance --access public
