name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)publish, for example sdk-v0.1.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      dir: ${{ steps.target.outputs.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Package directory from the release tag
        id: target
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          component="${TAG%-v*}"
          dir="packages/${component}"
          test -f "${dir}/package.json" || { echo "no package for tag ${TAG}"; exit 1; }
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Pack
        run: pnpm --filter "./${{ steps.target.outputs.dir }}" pack --pack-destination "${{ runner.temp }}/out"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tarball
          path: ${{ runner.temp }}/out/*.tgz
          if-no-files-found: error
          retention-days: 1

  npm:
    # Trusted publishing: npm exchanges this job's OIDC token for publish rights, so no NPM_TOKEN
    # exists anywhere. Provenance requires a GitHub-hosted runner and a public repository.
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: tarball
          path: out

      - name: Skip when this version is already on the registry
        id: existing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          name=$(tar -xzOf ./out/*.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).name")
          version=$(tar -xzOf ./out/*.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          if npm view "${name}@${version}" version  >/dev/null 2>&1; then
            echo "${name}@${version} is already published here; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with provenance
        if: steps.existing.outputs.skip != 'true'
        run: |
          npm install -g npm@^11.5
          npm publish ./out/*.tgz --provenance --access public
