version: 2
updates:
  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    rebase-strategy: 'disabled'
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    open-pull-requests-limit: 0
    rebase-strategy: 'disabled'
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # TypeScript 7 (native) has no JS Compiler API, which vite-plugin-dts and vue-tsc need.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Match the Node major CI runs on (node-version in ci.yml).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
